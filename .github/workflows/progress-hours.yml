name: Progress hours

# How long guilds fought each boss before it died -- the sum of every attempt up
# to and including the first kill, per guild, medians per boss.
#
# The owner asked for this as a chart (wtt-backend#170) and chose this metric over
# the two cheaper proxies: it is NOT `duration` on a progress ranking row (that is
# the killing pull's length, and 0 whenever the kill came from no log) and not
# calendar days.
#
# It lives here rather than in wtt-backend because the credentials do: that repo's
# .env carries placeholders and it has no GitHub Actions at all (wtt-backend#172),
# while this one already reads Warcraft Logs in four workflows.
#
# `workflow_dispatch` only. It spends real points, and how many is the open
# question the run answers.
on:
  workflow_dispatch:
    inputs:
      tier:
        description: 'Tier from fight_profiles.json (MID1 has real kills; MID2 is PTR ids)'
        default: 'MID1'
      encounter:
        # `cmd_progress_hours` has taken `--encounter` since it was written, and the
        # form could not reach it -- so a question about ONE boss cost a whole tier's
        # walk, which is what the point ceiling is spent on. 0 keeps the tier default,
        # so a dispatch that leaves this alone runs exactly what it ran before.
        #
        # A PTR id resolves to its live twin by itself (`harvest.choose_encounter_id`,
        # name-verified), so MID2's filed ids are the right thing to type here.
        description: 'One Warcraft Logs encounter id, or 0 for every boss of the tier'
        default: '0'
      difficulty:
        description: '3 Normal, 4 Heroic, 5 Mythic'
        default: '5'
      guilds:
        # 50, and the defaults here MUST match the CLI's. `fight-probe` shipped a
        # dispatch form whose max_pages said 3 while every real run passed 20, which
        # made every scheduled continuation a silent no-op. Treat these as
        # configuration, not as form hints.
        description: 'Guilds sampled per boss (50 = one ranking page)'
        default: '50'
      max_pages:
        description: 'Report pages per guild before giving up on finding its kill'
        default: '4'
      rankings_pages:
        description: 'Progress-ranking pages per boss, 50 guilds each. Needed above 50'
        default: '3'
      publish:
        description: 'Also write and commit <tier>/progress-hours.json for the site. Off by default: a pass measures first and publishes second'
        type: boolean
        default: false
      composition:
        # One extra query per MEASURED guild -- 23 on the Twin Fangs Mythic pass of
        # 2026-09-06, against 58 for the whole boss. Off by default so an ordinary
        # pass costs what it has always cost.
        description: "Read each measured guild's first-kill roster and split the hours by it"
        type: boolean
        default: false
      point_ceiling:
        # 0.7. There is no resume, so a ceiling stop discards the whole pass -- which
        # makes a too-low ceiling the expensive mistake here rather than the safe one.
        description: 'Stop before spending this share of the hourly point budget'
        default: '0.7'

concurrency:
  group: progress-hours
  cancel-in-progress: false

# Write, because `publish` commits `<tier>/progress-hours.json`. Stated rather than
# inherited so the grant stays a visible decision: with `publish` off -- the default
# -- this workflow still writes nothing into the repository, and the commit step's
# own `if:` is what enforces that rather than the token.
permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check credentials
        id: creds
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
        run: |
          if [ -z "$WCL_CLIENT_ID" ]; then
            echo "::error::WCL_CLIENT_ID is not set."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        working-directory: pipeline
        run: pip install -e '.[dev]'

      # Inputs are bound in `env:`, never interpolated into `run:`. A dispatched
      # value carrying a quote and a semicolon would otherwise become script, in a
      # job holding the Warcraft Logs secret.
      - name: Measure
        working-directory: pipeline
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          TIER: ${{ inputs.tier }}
          ENCOUNTER: ${{ inputs.encounter || '0' }}
          DIFFICULTY: ${{ inputs.difficulty }}
          GUILDS: ${{ inputs.guilds }}
          MAX_PAGES: ${{ inputs.max_pages }}
          RANKINGS_PAGES: ${{ inputs.rankings_pages }}
          CEILING: ${{ inputs.point_ceiling }}
          COMPOSITION: ${{ inputs.composition }}
          PUBLISH: ${{ inputs.publish && '../web/public/data' || '' }}
        run: |
          set -euo pipefail
          # An array rather than an interpolated flag string: the value is data to
          # bash however it is spelled, and `${VAR:+...}` word-splitting rules are
          # exactly the kind of subtlety that turns into a silently-dropped flag.
          extra=()
          [ "$COMPOSITION" = "true" ] && extra+=(--composition)
          # Appended as ARRAY entries, so an empty PUBLISH adds no argument at all
          # rather than an empty string argparse would take as a directory named "".
          [ -n "$PUBLISH" ] && extra+=(--publish "$PUBLISH")
          python -m wowdps.cli progress-hours \
            --tier "$TIER" \
            --encounter "$ENCOUNTER" \
            --difficulty "$DIFFICULTY" \
            --guilds "$GUILDS" \
            --max-pages "$MAX_PAGES" \
            --rankings-pages "$RANKINGS_PAGES" \
            --point-ceiling "$CEILING" \
            "${extra[@]}" \
            --out "../progress-hours-$TIER.json" 2>&1 | tee ../progress-hours.log

      # Always: the run whose log somebody needs is precisely the one that stopped
      # early. `gear.yml` shipped the default `success()` here and threw away the
      # two failures the upload existed for.
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progress-hours
          path: |
            progress-hours-*.json
            progress-hours.log
          if-no-files-found: ignore

      - name: Commit the published document
        if: inputs.publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add web/public/data
          if git diff --staged --quiet; then
            echo "progress hours unchanged"
            exit 0
          fi
          git commit -m "data: refresh progress hours for ${TIER} $(date -u +%Y-%m-%d)"
          # Rebase before pushing, for the reason `fight-probe.yml` records: these
          # workflows commit into one branch and run concurrently with each other and
          # with a person's own pushes, so a bare push loses the race and fails a run
          # whose actual work succeeded.
          pushed=false
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            if git push origin "HEAD:${{ github.ref_name }}"; then pushed=true; break; fi
            echo "push attempt $attempt lost the race; retrying"
            sleep $((attempt * 5))
          done
          # Losing three times is a real failure, not something to exit 0 on.
          [ "$pushed" = true ]
        env:
          TIER: ${{ inputs.tier }}

      - name: Summary
        if: always()
        env:
          TIER: ${{ inputs.tier }}
          ENCOUNTER: ${{ inputs.encounter || '0' }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib
          path = pathlib.Path(f"progress-hours-{os.environ['TIER']}.json")
          if not path.is_file():
              print("The run wrote no document. Read the log.")
              raise SystemExit(0)
          d = json.loads(path.read_text(encoding="utf-8"))
          # The encounter is named because a one-boss table otherwise reads as a
          # whole tier that happens to have one boss.
          asked = os.environ.get("ENCOUNTER", "0")
          scope = "" if asked in ("", "0") else f", encounter {asked} only"
          print(f"## {d['tier']} progress hours ({d['difficultyName']}{scope})\n")
          print("| # | boss | median h | IQR | sample | of guilds | nights | span d | from log |")
          print("|---|---|---|---|---|---|---|---|---|")
          for b in d["bosses"]:
              med = "—" if b["medianHours"] is None else f"{b['medianHours']:.2f}"
              iqr = "—" if b["q1Hours"] is None else f"{b['q1Hours']:.2f}–{b['q3Hours']:.2f}"
              # Nights and span are the disclosure the metric cannot repair: after the
              # screens the residual error is a raid night nobody uploaded, and few
              # nights across a wide span is what that looks like from outside.
              nights = "—" if b.get("medianNightsObserved") is None else f"{b['medianNightsObserved']:.0f}"
              span = "—" if b.get("medianSpanDays") is None else f"{b['medianSpanDays']:.1f}"
              seen = b.get("killsFromLog", 0) + b.get("killsNotFromLog", 0)
              log = "—" if not seen else f"{b.get('killsFromLog', 0)}/{seen}"
              short = " ⚠" if b.get("sampleShortOfRequest") else ""
              print(f"| {b['order']} | {b['name']} | {med} | {iqr} | {b['sample']} | {b['guildsSeen']}{short} | {nights} | {span} | {log} |")
          for b in d["bosses"]:
              split = b.get("compositionSplit")
              if not split:
                  continue
              # Three groups, never two: a guild whose roster could not be read is
              # counted apart, because putting it in `without` would answer the
              # question with guilds nobody established anything about.
              print(f"\n### {b['name']}: at least {split['atLeast']}x {split['spec']}\n")
              print("| group | guilds | median h | IQR |")
              print("|---|---|---|---|")
              for key, label in (("with", "with"), ("without", "without"), ("unknown", "roster unread")):
                  g = split[key]
                  gmed = "—" if g["medianHours"] is None else f"{g['medianHours']:.2f}"
                  giqr = "—" if g["q1Hours"] is None else f"{g['q1Hours']:.2f}–{g['q3Hours']:.2f}"
                  print(f"| {label} | {g['sample']} | {gmed} | {giqr} |")
          total = d["seasonTotalHours"]
          print(f"\n**Season total:** {'refused — a boss is unmeasured' if total is None else f'{total:.2f} h'}")
          print(f"\n**Cost:** {d['cost']['pointsSpent']} points of {d['cost']['limitPerHour']}/hour")
          sc = d.get("screens") or {}
          if sc:
              print(
                  f"\n**Screened out:** {sc.get('unloggedKill', 0)} no log behind the ranked kill, "
                  f"{sc.get('killTooLate', 0)} logged kill later than the ranked one, "
                  f"{sc.get('killTooEarly', 0)} earlier, "
                  f"{sc.get('unscreenedRows', 0)} rows carrying neither field."
              )
              if sc.get("unscreenedRows"):
                  print("\n> ⚠ Rows carrying neither `fromlog` nor `killTime` is a SCHEMA alarm, "
                        "not a property of the guilds. The screens cannot run on them.")
          print(
              "\n> Every figure is a **lower bound**. A raid night that was never "
              "uploaded is invisible to this and to every other reader of the Warcraft "
              "Logs API — read *nights* beside *span d*: few nights across a wide span "
              "is a partial observation. Each boss's median also comes from a different "
              "guild cohort, so the season total is a sum of per-boss bests rather than "
              "what one raid's progression cost."
          )
          PY
