name: Warcraft Logs verification

# Optional cross-check: pulls ranking medians from Warcraft Logs and writes a
# comparison file the site can show next to the sims. Skips itself cleanly when
# the API credentials are not configured, so the repo works without them.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: logs-verification

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check credentials
        id: creds
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
        run: |
          if [ -z "$WCL_CLIENT_ID" ]; then
            echo "::notice::WCL_CLIENT_ID is not set — skipping. Add WCL_CLIENT_ID and WCL_CLIENT_SECRET as repository secrets to enable this, see https://www.warcraftlogs.com/api/clients/"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.creds.outputs.enabled == 'true'
        with:
          python-version: '3.12'

      - name: Install pipeline
        if: steps.creds.outputs.enabled == 'true'
        run: pip install -e ./pipeline

      # There is deliberately NO actions/cache step here, and that is a measurement
      # rather than an omission. `spec_rankings` sends (encounterId, difficulty,
      # metric, className, specName, page) and nothing in that varies with time, so
      # a given spec's ranking hashes to the same cache file every week. A restored
      # cache would therefore serve LAST week's medians under this run's
      # `generatedAt` -- the weekly pass becomes a no-op that looks like a
      # measurement. `fight-probe` and `spawn-probe` may restore one because a
      # report's events are immutable; a ranking is the thing this pass re-reads.
      #
      # `--cache` exists on the command for iterating offline after paying for one
      # pass. It does not belong in a schedule.
      - name: Fetch rankings
        if: steps.creds.outputs.enabled == 'true'
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        # `set +e` around the run, because the runner's default shell is
        # `bash -eo pipefail` and errexit would end the step at the command, before
        # $? is read -- the dead-exit-code-branch defect `progress-sweep.yml`
        # already carries the fix for.
        run: |
          set +e
          wowdps verify --data web/public/data --point-ceiling 0.8
          status=$?
          set -e
          if [ "$status" = "2" ]; then
            echo "::warning::The point ceiling stopped the pass before it covered the tier. Nothing was written; the published comparison is unchanged. Re-run when the hourly budget resets."
            exit 0
          fi
          exit "$status"

      - name: Commit
        if: steps.creds.outputs.enabled == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add 'web/public/data/*/logs-verification.json'
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "data: refresh Warcraft Logs comparison $(date -u +%Y-%m-%d)"
          # Rebase before pushing. These workflows commit into one branch and run
          # concurrently with each other and with a person's own pushes, so a bare
          # push loses the race and fails a run whose actual work succeeded --
          # observed three times on 2026-08-16/17, each time discarding a completed
          # probe pass for a reason that had nothing to do with it. The commits are
          # data-only and touch disjoint files, so rebasing is safe; --autostash
          # covers anything the run left in the tree.
          # github.ref_name rather than `git rev-parse --abbrev-ref HEAD`: a
          # checkout is detached for some event types and would resolve to "HEAD".
          pushed=false
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            if git push origin "HEAD:${{ github.ref_name }}"; then pushed=true; break; fi
            echo "push attempt $attempt lost the race; retrying"
            sleep $((attempt * 5))
          done
          # Losing three times is a real failure, not something to exit 0 on.
          [ "$pushed" = true ]
