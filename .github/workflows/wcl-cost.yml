name: WCL cost

# What does asking for a field or an argument cost?
#
# #170's remaining open measurements, all three of the same shape: one document
# against the same document with one thing changed.
#
#   the reading block   two of this package's query documents carry none --
#                       PROGRESS_RANKINGS_QUERY and GUILD_PULLS_QUERY, both on
#                       progress-sweep's hot path -- so that cron pays a standalone
#                       rate_limit() per guild to learn what its own queries could
#                       have told it. Measured 2026-09-13: no cost detected, bounded
#                       under 1% of the 1.01-point query it rides on.
#   the fights() filter does an UNFILTERED fights() cost more? The catalogue splits
#                       its stages on the answer.
#   includeResources    spawn-probe cannot ask for a coordinate without it.
#
# The last two need a REPORT CODE, which is an input here rather than a discovery:
# read one off a committed fights.json and it costs no query. Without one this runs
# the block pair alone and SAYS which questions it did not ask.
#
# THERE IS NO `actions/cache` STEP, AND THAT IS THE MEASUREMENT RATHER THAN AN
# OMISSION. A cached response really does spend nothing, so a warm store reports
# zeros on both sides -- which the command correctly calls UNMEASURED and a reader
# would take for "the field is free". `harvest-builds.yml` shipped exactly that
# defect once: it passed `--cache` unconditionally, so its probe mode, whose whole
# purpose is to measure, could never measure. The command has no `--cache` option at
# all; this file must not grow a cache around it.
#
# Read-only. It commits nothing, writes no dataset, and costs a few dozen queries.
on:
  workflow_dispatch:
    inputs:
      encounter:
        description: 'Encounter id to ask about (a live id, not a PTR twin)'
        default: '3421'
      difficulty:
        description: 'Difficulty'
        default: '5'
      page:
        description: 'Ranking page'
        default: '1'
      report:
        # Unlocks the two ARGUMENT pairs. It is an INPUT rather than a discovery --
        # read one off a committed fights.json -- so it costs no query, which is the
        # rule GUILD_PULLS_QUERY is still excluded under.
        description: 'A report code, for the fights() filter and includeResources pairs. Empty runs the block pair alone'
        default: ''
      fight:
        description: 'A fight id in that report, for the includeResources pair. Empty skips it'
        default: ''
      events_limit:
        description: 'Events per side of the includeResources pair. Same on both sides, so it bounds the response without moving the comparison'
        default: '300'
      repeats:
        description: 'Read/send/read rounds per side. The SPREAD decides the verdict, so one round separates nothing'
        default: '3'
      point_ceiling:
        description: 'Fraction of the hourly budget at which to stop'
        default: '0.8'

concurrency:
  group: wcl-cost

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check credentials
        id: creds
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
        run: |
          if [ -z "$WCL_CLIENT_ID" ]; then
            echo "::notice::WCL_CLIENT_ID is not set — skipping."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.creds.outputs.enabled == 'true'
        with:
          python-version: '3.12'

      - name: Install pipeline
        if: steps.creds.outputs.enabled == 'true'
        run: pip install -e ./pipeline

      - name: Measure
        if: steps.creds.outputs.enabled == 'true'
        env:
          # Bound here, never interpolated into the script. `${{ inputs.x }}` is
          # substituted BEFORE bash parses the line, so a dispatched value carrying a
          # quote and a semicolon becomes script -- in a job holding the Warcraft Logs
          # secret. An environment variable is data to bash however it is spelled.
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          ENCOUNTER: ${{ inputs.encounter }}
          DIFFICULTY: ${{ inputs.difficulty }}
          PAGE: ${{ inputs.page }}
          REPORT: ${{ inputs.report }}
          FIGHT: ${{ inputs.fight }}
          EVENTS_LIMIT: ${{ inputs.events_limit }}
          REPEATS: ${{ inputs.repeats }}
          CEILING: ${{ inputs.point_ceiling }}
        run: |
          # An array rather than an interpolated flag string: an empty REPORT has to
          # add NO argument at all, where `${VAR:+...}` word-splitting is exactly the
          # subtlety that turns into a silently-dropped flag.
          extra=()
          [ -n "$REPORT" ] && extra+=(--report "$REPORT")
          [ -n "$FIGHT" ] && extra+=(--fight "$FIGHT")
          [ -n "$EVENTS_LIMIT" ] && extra+=(--events-limit "$EVENTS_LIMIT")
          # The runner's default shell is `bash -eo pipefail`, so errexit would end
          # the step AT the pipeline and never reach `status=$?` -- which is how
          # `progress-sweep.yml`'s exit-code branches were dead on arrival.
          set +e
          set -o pipefail
          wowdps -v wcl-cost \
            --encounter "$ENCOUNTER" \
            --difficulty "$DIFFICULTY" \
            --page "$PAGE" \
            --repeats "$REPEATS" \
            --point-ceiling "$CEILING" \
            "${extra[@]}" 2>&1 | tee cost.txt
          status=$?
          set -e
          if [ "$status" = "2" ]; then
            # Both the ceiling and a 429 land here, and they are the same fact: the
            # hour is spent. What was measured before it is above.
            echo "::warning::the hour stopped the pass; what was measured is above"
            exit 0
          fi
          exit "$status"

      - name: Summary
        # `always()`, because the ceiling stop and a refusal both produce output a
        # person has to read, and a custom `if:` with no status function silently
        # gets `success()` ANDed in.
        if: always() && steps.creds.outputs.enabled == 'true'
        run: |
          {
            echo '## What does asking for this cost?'
            echo
            echo 'A counter that did not move is UNMEASURED, never zero. Two ranges'
            echo 'that overlap are inside the noise, never "the same cost".'
            echo
            echo '```'
            cat cost.txt 2>/dev/null || echo '(the command produced no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
