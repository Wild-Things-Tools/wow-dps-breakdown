name: Fight probe

# Exploratory, on demand, and it commits nothing unless asked to.
#
# The Warcraft Logs credentials are repository secrets, so this is the only place
# `wowdps fight-probe` can run at all -- a development checkout cannot reach the API.
# What comes back is a readable dump of what each boss's fights actually look like
# (target counts over time, add lifetimes, phase boundaries, auras on enemies, raid
# size) plus the raw response cache, uploaded as an artifact.
#
# It can also publish `web/public/data/<tier>/fights.json`, the dataset the site's
# Fights view draws -- opt in with the `publish` input. That file keeps the two halves
# apart rather than merging them: what the profile asserts, what the logs measured, and
# the difference, side by side. `fight_profiles.json` stays hand-edited; nothing here
# writes to it.
#
# Continuing across hours:
#
# The API meters by points per hour, and a full pass at a real sample size does not
# fit in one hour -- the first 40-report MID2 pass stopped at 80% of the budget with
# three of nine bosses unread. Points reset hourly, so the work is not lost, only
# postponed. `--resume` (on by default, reading the payload in --out) skips any
# encounter that already carries the requested number of fights, and the command exits
# 3 while any remain. The hourly schedule below exists only to clear that state: when
# nothing is outstanding it fetches nothing and costs nothing, because the encounter
# list is read from the cached payload before a single query is sent.
#
# The response cache and the partial payload both ride in an actions/cache keyed on
# the tier, which is what makes the continuation cheap rather than merely correct.
#
# Deliberately not a *nightly* schedule:
#
# * The dump is evidence for writing `pipeline/src/wowdps/data/fight_profiles.json`
#   by hand. A fight profile mixes measured facts with facts the owner states from
#   playing the encounter, and merging those is a judgement, not a merge -- which is
#   exactly why the published dataset shows both and resolves neither.
# * The API meters by points per hour, not requests, and event queries over a whole
#   Mythic pull are the expensive end of it. The command measures its own cost and
#   stops at 80% of the hour's budget; a cron that silently ate the budget every
#   night would take the weekly rankings check down with it. The hourly job here is
#   not that: it only continues a pass somebody started, and is a no-op otherwise.
#
# The response cache in the artifact is worth keeping: download it, point a local
# run at it with --cache, and the extraction can be iterated on offline for nothing.
on:
  # Only ever *continues* an unfinished pass. With nothing outstanding this does no
  # work and spends no points; see the note above.
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:
    inputs:
      encounters:
        description: 'Space-separated encounter ids, or empty for every boss in the newest zone'
        default: ''
      tier:
        description: 'Tier whose fight profiles the measurements are compared against'
        default: 'MID2'
      difficulty:
        description: '5 = Mythic, 4 = Heroic'
        default: '5'
      reports:
        description: 'Distinct kills to read per encounter (the main cost dial). Larger is what makes the aggregate band meaningful'
        default: '30'
      order:
        description: "Which kills: 'first' (earliest, alike, intended tuning) or 'top' (speed kills)"
        default: 'first'
      rankings_pages:
        description: 'Ranking pages to gather before choosing the first kills'
        default: '8'
      page:
        description: 'Rankings page to sample from; 1 is the world best, which is not a typical pull'
        default: '1'
      max_pages:
        description: 'Event pages per stream per fight'
        default: '3'
      point_ceiling:
        description: 'Abort once this fraction of the hourly point budget is spent'
        default: '0.8'
      cheap:
        description: 'Use enemy casts instead of enemy damage-taken as the presence signal'
        type: boolean
        default: false
      publish:
        description: 'Also write and commit web/public/data/<tier>/fights.json, so the Fights view shows this run'
        type: boolean
        default: false

concurrency:
  group: fight-probe

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check credentials
        id: creds
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
        run: |
          if [ -z "$WCL_CLIENT_ID" ]; then
            echo "::notice::WCL_CLIENT_ID is not set — skipping. Add WCL_CLIENT_ID and WCL_CLIENT_SECRET as repository secrets to enable this, see https://www.warcraftlogs.com/api/clients/"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.creds.outputs.enabled == 'true'
        with:
          python-version: '3.12'

      - name: Install pipeline
        if: steps.creds.outputs.enabled == 'true'
        run: pip install -e ./pipeline

      # Both halves of the continuation: the partial payload says which encounters are
      # already collected, and the response cache means the queries behind them are
      # never paid for twice. restore-keys lets an hourly run pick up the newest
      # previous state rather than needing an exact key match.
      - name: Restore probe state
        if: steps.creds.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: fight-probe
          key: fight-probe-${{ inputs.tier || 'MID2' }}-${{ github.run_id }}
          restore-keys: |
            fight-probe-${{ inputs.tier || 'MID2' }}-

      - name: Probe
        if: steps.creds.outputs.enabled == 'true'
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          # `inputs.*` is empty on a scheduled run, so every one carries the same
          # default the dispatch form shows. A continuation must use the *same*
          # settings as the pass it continues, or it would re-open every encounter.
          ENCOUNTERS: ${{ inputs.encounters }}
          TIER: ${{ inputs.tier || 'MID2' }}
          DIFFICULTY: ${{ inputs.difficulty || '5' }}
          REPORTS: ${{ inputs.reports || '30' }}
          ORDER: ${{ inputs.order || 'first' }}
          RANKINGS_PAGES: ${{ inputs.rankings_pages || '8' }}
          PAGE: ${{ inputs.page || '1' }}
          MAX_PAGES: ${{ inputs.max_pages || '3' }}
          POINT_CEILING: ${{ inputs.point_ceiling || '0.8' }}
          CHEAP: ${{ inputs.cheap }}
          PUBLISH: ${{ inputs.publish || github.event_name == 'schedule' }}
        run: |
          args=()
          for id in $ENCOUNTERS; do args+=(--encounter "$id"); done
          if [ "$CHEAP" = "true" ]; then args+=(--no-damage-events); fi
          # --publish writes the dataset from the same payload the artifact carries,
          # so the committed file and the evidence for it come out of one pass.
          if [ "$PUBLISH" = "true" ]; then args+=(--publish web/public/data); fi
          # Exit code 2 means the point ceiling stopped the pass; whatever was
          # collected is still written, so it is a warning rather than a failure.
          set +e
          wowdps -v fight-probe \
            --tier "$TIER" \
            --difficulty "$DIFFICULTY" \
            --reports "$REPORTS" \
            --order "$ORDER" \
            --rankings-pages "$RANKINGS_PAGES" \
            --page "$PAGE" \
            --max-pages "$MAX_PAGES" \
            --point-ceiling "$POINT_CEILING" \
            --out fight-probe \
            "${args[@]}"
          status=$?
          set -e
          if [ "$status" = "2" ]; then
            echo "::warning::the pass stopped early on the point ceiling; partial output uploaded"
          elif [ "$status" = "3" ]; then
            echo "::notice::encounters still outstanding; the hourly run will continue once points reset"
          elif [ "$status" != "0" ]; then
            exit "$status"
          fi

      - name: Summary
        if: steps.creds.outputs.enabled == 'true'
        run: |
          {
            echo '## Fight probe'
            echo
            echo '```'
            cat fight-probe/fight-probe-*.txt || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the published dataset
        if: steps.creds.outputs.enabled == 'true' && (inputs.publish || github.event_name == 'schedule')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add web/public/data
          if git diff --staged --quiet; then
            echo "fight dataset unchanged"
            exit 0
          fi
          git commit -m "data: refresh fight shapes for ${TIER} $(date -u +%Y-%m-%d)"
          git push
        env:
          TIER: ${{ inputs.tier || 'MID2' }}

      - uses: actions/upload-artifact@v4
        if: steps.creds.outputs.enabled == 'true'
        with:
          name: fight-probe
          path: fight-probe
          retention-days: 14
