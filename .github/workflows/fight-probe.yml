name: Fight probe

# Exploratory, on demand, and it commits nothing unless asked to.
#
# The Warcraft Logs credentials are repository secrets, so this is the only place
# `wowdps fight-probe` can run at all -- a development checkout cannot reach the API.
# What comes back is a readable dump of what each boss's fights actually look like
# (target counts over time, add lifetimes, phase boundaries, auras on enemies, raid
# size) plus the raw response cache, uploaded as an artifact.
#
# It can also publish `web/public/data/<tier>/fights.json`, the dataset the site's
# Fights view draws -- opt in with the `publish` input. That file keeps the two halves
# apart rather than merging them: what the profile asserts, what the logs measured, and
# the difference, side by side. `fight_profiles.json` stays hand-edited; nothing here
# writes to it.
#
# Continuing across hours:
#
# The API meters by points per hour, and a full pass at a real sample size does not
# fit in one hour -- the first 40-report MID2 pass stopped at 80% of the budget with
# three of nine bosses unread. Points reset hourly, so the work is not lost, only
# postponed. `--resume` (on by default, reading the payload in --out) skips any
# encounter that already carries the requested number of fights, and the command exits
# 3 while any remain. The hourly schedule below exists only to clear that state: when
# nothing is outstanding it fetches nothing and costs nothing, because the encounter
# list is read from the cached payload before a single query is sent.
#
# The response cache and the partial payload both ride in an actions/cache keyed on
# the tier, which is what makes the continuation cheap rather than merely correct.
#
# Deliberately not a *nightly* schedule:
#
# * The dump is evidence for writing `pipeline/src/wowdps/data/fight_profiles.json`
#   by hand. A fight profile mixes measured facts with facts the owner states from
#   playing the encounter, and merging those is a judgement, not a merge -- which is
#   exactly why the published dataset shows both and resolves neither.
# * The API meters by points per hour, not requests, and event queries over a whole
#   Mythic pull are the expensive end of it. The command measures its own cost and
#   stops at 80% of the hour's budget; a cron that silently ate the budget every
#   night would take the weekly rankings check down with it. The hourly job here is
#   not that: it only continues a pass somebody started, and is a no-op otherwise.
#
# The response cache in the artifact is worth keeping: download it, point a local
# run at it with --cache, and the extraction can be iterated on offline for nothing.
on:
  # Only ever *continues* an unfinished pass. With nothing outstanding this does no
  # work and spends no points; see the note above.
  #
  # NOTE: GitHub runs `schedule` triggers from the **default branch only**. This cron
  # does nothing at all while it lives on a feature branch -- measured, not assumed:
  # after adding it, seven consecutive fight-probe runs were still `workflow_dispatch`
  # with the :25 window long past. So an unfinished pass does not start continuing
  # itself until this file is on `main`; until then, continue it by dispatching the
  # workflow by hand, which resumes exactly the same way.
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:
    inputs:
      encounters:
        description: 'Space-separated encounter ids, or empty for every boss in the newest zone'
        default: ''
      tier:
        description: 'Tier whose fight profiles the measurements are compared against'
        default: 'MID2'
      difficulty:
        description: '5 = Mythic, 4 = Heroic'
        default: '5'
      reports:
        description: 'Distinct kills to read per encounter (the main cost dial). Larger is what makes the aggregate band meaningful'
        default: '30'
      order:
        description: "Which kills. 'public' searches the logs uploaded for the zone in a time window (reportData.reports) — not restricted to ranked parses, so it can see a public kill the rankings never carried. 'first' takes the earliest among the ranking pages gathered, which are sorted by damage. 'top' is the rankings' damage order, i.e. speed kills"
        default: 'public'
      lookback_days:
        description: "--order public: how far back from the earliest ranked kill the report search reaches. Nothing in the schema says when a raid opened, so the ranked sample anchors the window"
        default: '10'
      forward_days:
        description: '--order public: how far forward from that anchor'
        default: '14'
      report_pages:
        description: '--order public: pages of the report search to read, at 100 reports each. Measured: this search is the first thing in the project to move the point counter at all, so keep it small until a full pass has been costed'
        default: '5'
      rankings_pages:
        description: 'Ranking pages to gather before choosing the first kills. This is the window "first" is measured inside: Warcraft Logs sorts rankings by damage, so a slow first-night kill sits deep in the list and a narrow window silently returns later kills instead. Pages are cheap next to the per-fight event streams'
        # 40, not 8. The pages are a rounding error against a pass, and the failure a
        # narrow window produces is invisible: the sample is still truthfully "the
        # earliest kills we gathered", just gathered from the top parses. The kill
        # dates are published now, so this can be checked rather than believed.
        default: '40'
      page:
        description: 'Rankings page to sample from; 1 is the world best, which is not a typical pull'
        default: '1'
      max_pages:
        description: 'Event pages per stream per fight. This is what decides whether a kill is read to the end -- a band needs whole fights, not just many of them. Raising it re-opens encounters whose stored budget was smaller'
        # 20, and this default is load-bearing rather than a preference. A scheduled
        # run gets no `inputs.*`, so it takes whatever is written here -- and a
        # continuation that runs with a *smaller* budget than the pass it continues
        # does not merely fail to help, it goes silently inert: `is_complete` only
        # re-opens an encounter whose recorded budget is smaller than the one now
        # asked for, so every encounter already read at 12 or 20 pages counts as
        # done at 3, the hourly run fetches nothing, and the pass never finishes.
        # Observed exactly that on 2026-08-16: a 20-page dispatch left 8 of 9
        # encounters outstanding and each hourly continuation was a no-op.
        default: '20'
      no_resume:
        description: 'Ignore the collected payload and re-read every encounter. Needed once for a payload written before the event budget was recorded'
        type: boolean
        default: false
      point_ceiling:
        description: 'Abort once this fraction of the hourly point budget is spent'
        default: '0.8'
      cheap:
        description: 'Use enemy casts instead of enemy damage-taken as the presence signal'
        type: boolean
        default: false
      publish:
        description: 'Also write and commit web/public/data/<tier>/fights.json, so the Fights view shows this run'
        type: boolean
        default: false

concurrency:
  group: fight-probe

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check credentials
        id: creds
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
        run: |
          if [ -z "$WCL_CLIENT_ID" ]; then
            echo "::notice::WCL_CLIENT_ID is not set — skipping. Add WCL_CLIENT_ID and WCL_CLIENT_SECRET as repository secrets to enable this, see https://www.warcraftlogs.com/api/clients/"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.creds.outputs.enabled == 'true'
        with:
          python-version: '3.12'

      - name: Install pipeline
        if: steps.creds.outputs.enabled == 'true'
        run: pip install -e ./pipeline

      # Both halves of the continuation: the partial payload says which encounters are
      # already collected, and the response cache means the queries behind them are
      # never paid for twice. restore-keys lets an hourly run pick up the newest
      # previous state rather than needing an exact key match.
      - name: Restore probe state
        if: steps.creds.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: fight-probe
          key: fight-probe-${{ inputs.tier || 'MID2' }}-${{ github.run_id }}
          restore-keys: |
            fight-probe-${{ inputs.tier || 'MID2' }}-

      - name: Probe
        if: steps.creds.outputs.enabled == 'true'
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          # `inputs.*` is empty on a scheduled run, so every one carries the same
          # default the dispatch form shows. A continuation must use the *same*
          # settings as the pass it continues, or it would re-open every encounter.
          ENCOUNTERS: ${{ inputs.encounters }}
          TIER: ${{ inputs.tier || 'MID2' }}
          DIFFICULTY: ${{ inputs.difficulty || '5' }}
          REPORTS: ${{ inputs.reports || '30' }}
          ORDER: ${{ inputs.order || 'public' }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '10' }}
          FORWARD_DAYS: ${{ inputs.forward_days || '14' }}
          REPORT_PAGES: ${{ inputs.report_pages || '5' }}
          RANKINGS_PAGES: ${{ inputs.rankings_pages || '40' }}
          PAGE: ${{ inputs.page || '1' }}
          MAX_PAGES: ${{ inputs.max_pages || '20' }}
          POINT_CEILING: ${{ inputs.point_ceiling || '0.8' }}
          CHEAP: ${{ inputs.cheap }}
          NO_RESUME: ${{ inputs.no_resume }}
          PUBLISH: ${{ inputs.publish || github.event_name == 'schedule' }}
        run: |
          args=()
          for id in $ENCOUNTERS; do args+=(--encounter "$id"); done
          if [ "$CHEAP" = "true" ]; then args+=(--no-damage-events); fi
          if [ "$NO_RESUME" = "true" ]; then args+=(--no-resume); fi
          # --publish writes the dataset from the same payload the artifact carries,
          # so the committed file and the evidence for it come out of one pass.
          if [ "$PUBLISH" = "true" ]; then args+=(--publish web/public/data); fi
          # Exit code 2 means the point ceiling stopped the pass; whatever was
          # collected is still written, so it is a warning rather than a failure.
          set +e
          wowdps -v fight-probe \
            --tier "$TIER" \
            --difficulty "$DIFFICULTY" \
            --reports "$REPORTS" \
            --order "$ORDER" \
            --lookback-days "$LOOKBACK_DAYS" \
            --forward-days "$FORWARD_DAYS" \
            --report-pages "$REPORT_PAGES" \
            --rankings-pages "$RANKINGS_PAGES" \
            --page "$PAGE" \
            --max-pages "$MAX_PAGES" \
            --point-ceiling "$POINT_CEILING" \
            --out fight-probe \
            "${args[@]}"
          status=$?
          set -e
          if [ "$status" = "2" ]; then
            echo "::warning::the pass stopped early on the point ceiling; partial output uploaded"
          elif [ "$status" = "3" ]; then
            echo "::notice::encounters still outstanding; the hourly run will continue once points reset"
          elif [ "$status" != "0" ]; then
            exit "$status"
          fi

      - name: Summary
        if: always() && steps.creds.outputs.enabled == 'true'
        run: |
          {
            echo '## Fight probe'
            echo
            echo '```'
            cat fight-probe/fight-probe-*.txt || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the published dataset
        if: steps.creds.outputs.enabled == 'true' && (inputs.publish || github.event_name == 'schedule')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add web/public/data
          if git diff --staged --quiet; then
            echo "fight dataset unchanged"
            exit 0
          fi
          git commit -m "data: refresh fight shapes for ${TIER} $(date -u +%Y-%m-%d)"
          # Rebase before pushing. These workflows commit into one branch and run
          # concurrently with each other and with a person's own pushes, so a bare
          # push loses the race and fails a run whose actual work succeeded --
          # observed three times on 2026-08-16/17, each time discarding a completed
          # probe pass for a reason that had nothing to do with it. The commits are
          # data-only and touch disjoint files, so rebasing is safe; --autostash
          # covers anything the run left in the tree.
          # github.ref_name rather than `git rev-parse --abbrev-ref HEAD`: a
          # checkout is detached for some event types and would resolve to "HEAD".
          pushed=false
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            if git push origin "HEAD:${{ github.ref_name }}"; then pushed=true; break; fi
            echo "push attempt $attempt lost the race; retrying"
            sleep $((attempt * 5))
          done
          # Losing three times is a real failure, not something to exit 0 on.
          [ "$pushed" = true ]
        env:
          TIER: ${{ inputs.tier || 'MID2' }}

      # `always()`, and it is load-bearing rather than tidiness. A custom `if:`
      # without a status function still gets `success()` ANDed in by GitHub, so
      # this step used to be skipped on exactly the failures the partial payload
      # exists for. The pass writes per encounter and the step above says so in
      # its own comment ("whatever was collected is still written") -- that
      # output was then thrown away one step later, along with the Warcraft Logs
      # points that bought it.
      #
      # Exit 2 (point ceiling) and 3 (outstanding) are already downgraded to
      # warnings above, so those uploaded. What did not: exit 1, the
      # one-difficulty refusal, and any crash -- the two cases where a human most
      # needs to see how far the pass got.
      #
      # Same defect `gear.yml` shipped and fixed; CLAUDE.md there names `buffs`
      # and `sims` as having the same shape and left them deliberately, because
      # whether THEIR sweeps write partial output is an open question. This one
      # is not open: it writes.
      - uses: actions/upload-artifact@v4
        if: always() && steps.creds.outputs.enabled == 'true'
        with:
          name: fight-probe
          path: fight-probe
          # A pass that died before its first encounter has nothing to upload,
          # and that is not itself a failure worth failing the run over.
          if-no-files-found: ignore
          retention-days: 14
