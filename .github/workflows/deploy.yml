name: Deploy

# Publishes the SPA to GitHub Pages. Runs on every push to main, which includes
# the dataset commits the Simulations workflow makes, so fresh sims go live on
# their own.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Check the dataset is present
        run: |
          if [ ! -f web/public/data/index.json ]; then
            echo "::error::web/public/data/index.json is missing — run the Simulations workflow first"
            exit 1
          fi

      - name: Build
        working-directory: web
        env:
          # Pages serves the site from /<repo>/ unless a custom domain is set.
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
