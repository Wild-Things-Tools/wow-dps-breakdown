name: Deploy

# The site is published into the wt-gate repository, which is a Cloudflare Pages
# project sitting behind a Discord login. Pushing there is the whole job: Cloudflare
# rebuilds wt-gate on its own, and everything under its public/ directory ends up
# served from the site root.
#
# Why not GitHub Pages: this repository is private, and Pages will not serve a
# private repo without Enterprise. Cloudflare has no such restriction, so the source
# stays private either way.
#
# Going public later is a variable change, not a rewrite. Point SITE_BASE and
# HUB_PATH at an ungated Cloudflare project (or set SITE_BASE=/ for a project root)
# and nothing else moves — the built output is identical.
#
# STOOD DOWN 2026-08-30 (issue #112, owner decision 8 of 2026-08-29: "es gibt keine
# react seite mehr, es wird nicht mehr gehostet ... wir machen alles über nextpull").
# The product surface is nextpull (wtt-frontend), which fetches the committed
# `web/public/data/` files through wtt-backend, so committing a dataset is the whole
# publishing step and this workflow contributes nothing to it.
#
# `push: branches: [main]` is REMOVED rather than left to fire harmlessly, because it
# was not harmless: measured on 2026-08-30, the four most recent merges to main each
# ran this workflow to success and pushed a fresh copy of the built site into
# wt-gate. Against a project nobody serves that is pure git-history growth in another
# repository -- and this README's own cost section names history growth, not the
# Cloudflare quota, as the binding constraint there.
#
# `workflow_dispatch` stays so the route can be re-opened by hand without a rewrite,
# which is also how the hosting decision gets reversed if it ever is: dispatch once,
# and add the trigger back.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  # All three are overridable with repository variables (Settings -> Secrets and
  # variables -> Actions -> Variables).
  #
  # HUB_PATH is a path *inside* the hub repository; SITE_BASE is the URL prefix the
  # site is served under. They are deliberately independent: Cloudflare serves
  # wt-gate's public/ from the domain root, so public/wow-dps maps to /wow-dps/.
  # Deriving one from the other would produce /wt-gate/public/wow-dps/ and every
  # asset would 404.
  HUB_REPO: ${{ vars.HUB_REPO || 'Wild-Things-Tools/wt-gate' }}
  HUB_PATH: ${{ vars.HUB_PATH || 'public/wow-dps' }}
  SITE_BASE: ${{ vars.SITE_BASE || '/wow-dps/' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the destination is configured
        env:
          # Either name works. GATE_DEPLOY_PAT is what the other Wild Things repos
          # already call their wt-gate deploy token, so reusing that name avoids
          # minting a second token for the same job. It resolves for an organisation
          # secret shared with this repository as well as a repository secret on it.
          HUB_PAGES_TOKEN: ${{ secrets.GATE_DEPLOY_PAT || secrets.HUB_PAGES_TOKEN }}
        run: |
          echo "Publishing into $HUB_REPO at $HUB_PATH, served from $SITE_BASE"
          case "$SITE_BASE" in
            /*/ | /) ;;
            *) echo "::error::SITE_BASE must start and end with a slash, e.g. /wow-dps/ — got '$SITE_BASE'"; exit 1 ;;
          esac
          if [ -z "$HUB_PAGES_TOKEN" ]; then
            echo "::error::No deploy token. Expected GATE_DEPLOY_PAT or HUB_PAGES_TOKEN: a fine-grained PAT with Contents: read and write on $HUB_REPO. If it is an organisation secret, check that its repository access covers this repository -- one scoped to 'Selected repositories' must list it. A *repository* secret in a different repository is not visible here."
            exit 1
          fi

      - name: Check the dataset is present
        run: |
          if [ ! -f web/public/data/tiers.json ]; then
            echo "::error::web/public/data/tiers.json is missing — run the Simulations workflow first"
            exit 1
          fi
          # The tier index can list a tier whose manifest never made it into the commit;
          # the site would then load and fail on the first fetch, which is worse than
          # failing here.
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("web/public/data")
          index = json.loads((root / "tiers.json").read_text())
          missing = [t["id"] for t in index["tiers"] if not (root / t["id"] / "index.json").is_file()]
          if missing or not index["tiers"]:
              print(f"::error::tiers.json lists tiers with no manifest: {missing or 'none listed at all'}")
              sys.exit(1)
          print(f"::notice::publishing {len(index['tiers'])} tier(s), current {index['current']}")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: BASE_PATH="$SITE_BASE" npm run build

      - name: Publish into the hub repository
        env:
          HUB_PAGES_TOKEN: ${{ secrets.GATE_DEPLOY_PAT || secrets.HUB_PAGES_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${HUB_PAGES_TOKEN}@github.com/${HUB_REPO}.git" hub

          # Replace our directory wholesale so files dropped from the build do not
          # linger, and leave everything else in the hub untouched — it is somebody
          # else's project with its own app, functions and assets.
          rm -rf "hub/${HUB_PATH}"
          mkdir -p "hub/${HUB_PATH}"
          cp -r web/dist/. "hub/${HUB_PATH}/"

          cd hub
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --staged --quiet; then
            echo "site unchanged — nothing to publish"
            exit 0
          fi
          git commit -m "wow-dps: publish from ${GITHUB_SHA::7}"
          git push

      - name: Summary
        run: |
          {
            echo "Pushed to \`$HUB_REPO\` at \`$HUB_PATH\`."
            echo ""
            echo "Cloudflare rebuilds that project on push; the site will be live at"
            echo "\`<wt-gate domain>$SITE_BASE\` once the build finishes, behind the Discord login."
          } >> "$GITHUB_STEP_SUMMARY"
