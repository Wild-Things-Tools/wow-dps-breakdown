name: Gear comparison

# On demand only, and deliberately so.
#
# The arithmetic, measured rather than guessed, and it is now different per slot.
#
# A trinket spec is two simc invocations covering ~36 profilesets: every eligible
# Mythic+ trinket on its own to find the baseline pair, then the baseline plus every
# eligible raid trinket at two item levels. Its pool is too large to enumerate (351
# Mythic+ pairs), so it ranks items by standalone value and stays at ~36.
#
# A ring spec enumerates instead, over the whole pool rather than the Mythic+ half:
# 1 empty + 8 solo + 82 combinations + 1 baseline + 6 candidates = 98 profilesets.
# That is 2.2x the 44 the Mythic+-only enumeration ran, and it buys the second
# answer -- the best set overall, which the baseline-plus-one-swap search cannot
# reach. Measured on Arcane Mage, MID2, one target, 300 deterministic iterations:
# 63.5 CPU-seconds for 44 variants against 135.5 for 98, i.e. ~1.35 CPU-seconds a
# variant at that count and ~4.5 at the 1,000 this workflow defaults to.
#
# At 3,000 deterministic iterations a variant costs roughly 11 CPU-seconds at one
# target for a caster and about 2.5x that for a pet spec, and five targets is
# roughly 3x one.
#
# Measured end to end rather than derived: two runs of six ring specs at 1,000
# iterations on four cores cost 47m58s and 48m53s of CPU, i.e. ~8.1 CPU-minutes a
# spec. Wall clock on the same six spread 109-247s between the runs on load alone,
# so it is the CPU figure that travels.
#
#   full tier, trinket, one target : 52 builds x ~12 CPU-min  = ~620 CPU-min
#   full tier, finger,  one target : 52 builds x ~8.1 CPU-min = ~420 CPU-min
#   full tier, 1 + 5 targets                                  = roughly 4x either
#
# **Those figures doubled on 2026-08-26 and the per-build costs did not move.** They
# read "26 specs" while the tier holds 52 builds, because this workflow swept only
# simc's shipped profiles -- the materialisation steps below are new. Same shape of
# error CLAUDE.md already records for the baseline-combination table: plausible
# arithmetic over the wrong column. Re-do it here rather than anywhere else.
#
# Against 2,000 Actions minutes a month with ~800 already committed to the weekly
# simulation pass, CI and deploys: a single-target full pass is now most of what is
# left rather than a comfortable fit, and 1+5 targets does not fit at all. Neither
# fits a schedule, which was already true. Trinkets
# change when a raid tier changes, which is not a weekly event, so a schedule would
# buy nothing anyway -- run this when the loot table changes or when simc's item
# modelling for the tier lands.
#
# Sharded because one job cannot hold a full pass: 52 builds at ~12 CPU-minutes is
# over ten hours on a 2-vCPU runner and the job limit is six. Sharding does not
# reduce the bill -- matrix jobs bill as the sum of their job-minutes -- it just
# keeps each job inside the limit.
on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Tier to sweep: a name, 'latest' or 'previous'"
        default: 'latest'
      slot:
        description: 'Equipment slot to sweep. Neck and finger carry the profile''s own gems and enchants on both sides of every comparison -- without them a ring sweep measures the wrong thing by an order of magnitude'
        default: 'trinket'
        type: choice
        options: [trinket, neck, finger]
      targets:
        description: 'Space-separated target counts, e.g. "1" or "1 5"'
        default: '1'
      specs:
        description: 'Space-separated spec ids, or empty for the whole tier'
        default: ''
      shards:
        description: 'How many parallel jobs to split the specs across'
        default: '4'
      iterations:
        description: 'Fixed iteration count per variant (deterministic)'
        default: '1000'

concurrency:
  group: gear
  cancel-in-progress: false

permissions:
  contents: write

env:
  TIER: ${{ inputs.tier }}
  SLOT: ${{ inputs.slot }}
  TARGETS: ${{ inputs.targets }}
  SPECS: ${{ inputs.specs }}
  SHARDS: ${{ inputs.shards }}
  ITERATIONS: ${{ inputs.iterations }}

jobs:
  build-simc:
    name: Build SimulationCraft
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - name: Checkout SimulationCraft
        id: simc
        run: |
          git clone --depth 1 https://github.com/simulationcraft/simc.git simc
          echo "sha=$(git -C simc rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache build tree
        id: cache
        uses: actions/cache@v4
        with:
          # Shared with sims.yml on purpose: the same key means whichever workflow
          # runs first pays for the build and the other one gets it for nothing.
          path: simc/build
          key: simc-build-${{ runner.os }}-${{ steps.simc.outputs.sha }}
          restore-keys: simc-build-${{ runner.os }}-

      - name: Build
        run: |
          cmake -B simc/build -S simc \
            -DCMAKE_BUILD_TYPE=Release \
            -DSC_NO_NETWORKING=ON \
            -DBUILD_GUI=OFF
          cmake --build simc/build -j"$(nproc)"

      - name: Package binary and profiles
        run: |
          mkdir -p bundle
          cp simc/build/simc bundle/simc
          strip bundle/simc || true
          cp -r simc/profiles bundle/profiles
          # simc's *source* tables, at the path every `--simc-source` reader
          # expects. They used to land in `bundle/dbc/generated` under a comment
          # about `wowdps gear-candidates` -- a command this workflow never runs,
          # and a path nothing in it ever read. `wowdps extra-builds` DOES read
          # them, to validate a supplied hash against the current trait table
          # before writing the profile, and it looks under `engine/dbc/generated`.
          # One copy, at the path with a reader.
          mkdir -p bundle/engine/dbc
          cp -r simc/engine/dbc/generated bundle/engine/dbc/generated

      - uses: actions/upload-artifact@v4
        with:
          name: simc-bundle-gear
          path: bundle
          retention-days: 1
          compression-level: 6

      - id: matrix
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          print("shards=" + json.dumps(list(range(int(os.environ["SHARDS"])))))
          PY

  sweep:
    name: Sweep ${{ inputs.slot }} (shard ${{ matrix.shard }})
    needs: build-simc
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.build-simc.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: simc-bundle-gear
          path: bundle

      - name: Install pipeline
        run: |
          chmod +x bundle/simc
          pip install -e ./pipeline

      # The same two steps `sims.yml` and `build-search.yml` run, and for the same
      # reason: the tier is what simc ships PLUS what this project materialises.
      # Without them this sweep sees only simc's shipped profiles -- the committed
      # `gear.json` covers 28 builds of the 52 `index.json` ranks, and publishes
      # `coverage {specs: 28, specsAvailable: 28}`, which reads as complete because
      # the denominator comes from the run's own profile discovery.
      #
      # Every shard runs them over the same generator files, so the discovered set
      # is identical everywhere and the round-robin split stays consistent.
      # `$TIER` comes from the workflow-level `env:` above, like every other step
      # here -- restating it per step would be two spellings of one value.
      - name: Materialise the unvalidated profiles
        run: wowdps -v unvalidated --tier "$TIER" --simc-source bundle --write

      # After the unvalidated pass, because some cells deliberately supersede a
      # refused materialised profile of the same filename.
      - name: Materialise the extra builds
        run: wowdps -v extra-builds --tier "$TIER" --simc-source bundle --write

      - name: Sweep
        run: |
          args=()
          for count in $TARGETS; do args+=(--targets "$count"); done
          for spec in $SPECS; do args+=(--spec "$spec"); done
          wowdps gear \
            --simc bundle/simc \
            --profiles bundle/profiles \
            --tier "$TIER" \
            --slot "$SLOT" \
            --shard "${{ matrix.shard }}/$SHARDS" \
            --max-iterations "$ITERATIONS" \
            "${args[@]}" \
            --out shard

      # `always()`, because this is the only step that gets a partial sweep off the
      # runner and the two cases it exists for are both failures. A step with no
      # `if:` defaults to `success()`, so a `wowdps gear` that exits non-zero, or a
      # shard that hits `timeout-minutes: 350`, would skip the upload entirely --
      # `publish` below then downloads nothing for that shard and merges none of its
      # specs. The dataset is written after every spec precisely so an interrupted
      # sweep leaves a smaller honest answer, and without this that answer never
      # leaves the machine. `always()` rather than `!cancelled()` on purpose: a job
      # timeout *is* a cancellation, and it is one of the two cases.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gear-shard-${{ matrix.shard }}
          path: shard
          retention-days: 3
          # A shard that failed before its first spec finished has no directory to
          # upload, and that is an ordinary outcome here rather than a fault worth
          # a red annotation on an otherwise-explained run.
          if-no-files-found: ignore

  publish:
    name: Merge and commit
    needs: [build-simc, sweep]
    # Publish whatever finished. The dataset carries its own coverage count and the
    # view shows it, so a partial sweep is a smaller honest answer rather than a
    # silently incomplete one.
    if: always() && needs.sweep.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: gear-shard-*
          path: shards

      - name: Install pipeline
        run: pip install -e ./pipeline

      - name: Merge shards
        run: |
          shopt -s nullglob
          dirs=(shards/gear-shard-*)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "::error::no shard produced any gear data"
            exit 1
          fi
          wowdps merge "${dirs[@]}" --out web/public/data

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add web/public/data
          if git diff --staged --quiet; then
            echo "gear dataset unchanged"
            exit 0
          fi
          git commit -m "data: refresh ${SLOT} comparison $(date -u +%Y-%m-%d)"
          # Rebase before pushing. These workflows commit into one branch and run
          # concurrently with each other and with a person's own pushes, so a bare
          # push loses the race and fails a run whose actual work succeeded --
          # observed three times on 2026-08-16/17, each time discarding a completed
          # probe pass for a reason that had nothing to do with it. The commits are
          # data-only and touch disjoint files, so rebasing is safe; --autostash
          # covers anything the run left in the tree.
          # github.ref_name rather than `git rev-parse --abbrev-ref HEAD`: a
          # checkout is detached for some event types and would resolve to "HEAD".
          pushed=false
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            if git push origin "HEAD:${{ github.ref_name }}"; then pushed=true; break; fi
            echo "push attempt $attempt lost the race; retrying"
            sleep $((attempt * 5))
          done
          # Losing three times is a real failure, not something to exit 0 on.
          [ "$pushed" = true ]
