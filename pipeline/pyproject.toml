[project]
name = "wowdps-pipeline"
version = "0.1.0"
description = "SimulationCraft orchestration and dataset builder for the WoW DPS Breakdown site"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # `test_harvest.py` validates the harvest's GraphQL documents against an inline
    # schema excerpt behind `pytest.importorskip("graphql")` -- no service and no
    # credentials, so there is no reason for it not to run. Undeclared until
    # 2026-08-26, which meant it ran only where something else had pulled it in and
    # skipped silently everywhere else, CI included.
    "graphql-core>=3.2",
]

[project.scripts]
wowdps = "wowdps.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
